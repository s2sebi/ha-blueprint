blueprint:
  name: Motion-activated Light (only when sun is up and someone at home)
  description: Turn on a light when motion is detected.
  domain: automation
  source_url: https://github.com/s2sebi/ha-blueprint/main/tst_light.yaml
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    numeric_state1:
      name: Warunek1
      description: pierwszy warunek
      selector:
        target:      
          entity:
            domain: input_boolean
    home_entity:
      name: Home entity
      description: This is typically "zone.home".
      default: zone.home
      selector:
        entity:
          domain: zone

# If motion is detected within the delay,
# we restart the script.
mode: restart
max_exceeded: silent

trigger:
  platform: state
  entity_id: !input motion_entity
  from: "off"
  to: "on"

condition:
  - condition: numeric_state
    entity_id: !input home_entity
    above: 0
  - condition: numeric_state
    entity_id: !input numeric_state1
    below: 0

action:
  - alias: "Turn on the light"
    service: light.turn_on
    target: !input light_target
  - alias: "Wait until there is no motion from device"
    wait_for_trigger:
      platform: state
      entity_id: !input motion_entity
      from: "on"
      to: "off"
  - alias: "Wait the number of seconds that has been set"
    delay: !input no_motion_wait
  - alias: "Turn off the light"
    service: light.turn_off
    target: !input light_target