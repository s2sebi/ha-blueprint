blueprint:
  name: Zone disarm confirmation
  description: Ask whether to disarm the alarm when the user enters the zone
  domain: automation
  source_url: https://github.com/s2sebi/ha-blueprint/blob/main/ask_enter_zone.yaml
  author: S2sebi (Home Assistant)
  input:
    person_entity:
      name: Person
      selector:
        entity:
          filter:
            domain: person
    zone_entity:
      name: Zone
      selector:
        entity:
          filter:
            domain: zone
    notify_device:
      name: Device to notify
      description: Device needs to run the official Home Assistant app to receive notifications.
      selector:
        device:
          filter:
            integration: mobile_app

triggers:
  trigger: state
  entity_id: !input person_entity

variables:
  zone_entity: !input zone_entity
  # This is the state of the person when it's in this zone.
  zone_state: "{{ states[zone_entity].name }}"
  person_entity: !input person_entity
  person_name: "{{ states[person_entity].name }}"

conditions:
  condition: template
  # The first case handles leaving the Home zone which has a special state when zoning called 'home'.
  # The second case handles leaving all other zones.
  value_template: "{{ zone_entity == 'zone.home' and trigger.from_state.state != 'home' and trigger.to_state.state == 'home' or trigger.from_state.state != zone_state and trigger.to_state.state == zone_state }}"

actions:
  - alias: "Notify that a person has ENTER the zone"
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    message: "{{ person_name }} has ENTER {{ zone_state }}"
